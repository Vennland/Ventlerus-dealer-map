<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#0f0f1a; height:100vh; overflow:hidden; color:#e0e0f0; }
  #header { background:linear-gradient(135deg,#1a1a2e,#16213e); padding:10px 16px; display:flex; align-items:center; gap:10px; border-bottom:2px solid #ff6b2b; height:56px; position:fixed; top:0; left:0; right:0; z-index:1000; }
  .logo { width:34px; height:34px; object-fit:contain; flex-shrink:0; }
  .htitle { font-size:16px; font-weight:700; color:#fff; }
  .hsub { font-size:10px; color:#888; margin-top:1px; }
  .badge { margin-left:auto; background:rgba(255,107,43,0.15); border:1px solid rgba(255,107,43,0.4); color:#ff6b2b; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
  #container { display:flex; height:100vh; padding-top:56px; }
  #sidebar { width:260px; flex-shrink:0; background:#12121f; border-right:1px solid #2a2a4a; display:flex; flex-direction:column; overflow:hidden; }
  #search-wrap { padding:10px; border-bottom:1px solid #2a2a4a; }
  #filter-wrap { padding:6px 10px; border-bottom:1px solid #2a2a4a; display:flex; gap:6px; }
  .filter-btn { flex:1; padding:5px 2px; border-radius:6px; border:1px solid #3a3a5a; background:transparent; color:#888; font-size:10px; cursor:pointer; font-family:inherit; transition:all 0.15s; white-space:nowrap; }
  .filter-btn.active-dealer { background:rgba(255,107,43,0.15); border-color:#ff6b2b; color:#ff6b2b; }
  .filter-btn.active-as { background:rgba(79,142,247,0.15); border-color:#4f8ef7; color:#4f8ef7; }
  #search-input { width:100%; background:#1e1e35; border:1px solid #3a3a5a; border-radius:8px; padding:8px 10px; color:#e0e0f0; font-size:12px; font-family:inherit; outline:none; }
  #search-input:focus { border-color:#ff6b2b; }
  #search-input::placeholder { color:#555; }
  #list-wrap { flex:1; overflow-y:auto; padding:4px; -webkit-overflow-scrolling:touch; }
  #list-wrap::-webkit-scrollbar { width:3px; }
  #list-wrap::-webkit-scrollbar-thumb { background:#3a3a5a; border-radius:2px; }
  .item { padding:9px 11px; border-radius:8px; cursor:pointer; margin-bottom:2px; border:1px solid transparent; transition:all 0.15s; }
  .item:hover { background:#1e1e35; border-color:#3a3a5a; }
  .item.active { background:rgba(255,107,43,0.1); border-color:rgba(255,107,43,0.4); }
  .item.as-item.active { background:rgba(79,142,247,0.1); border-color:rgba(79,142,247,0.4); }
  .pr-dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#000; border:2px solid #fff; box-shadow:0 0 0 1px #444; margin-right:2px; vertical-align:middle; }
  .item.priority-item { border-color:rgba(255,255,255,0.25); }
  .item.priority-item.active { background:rgba(255,255,255,0.08); border-color:#fff; }
  .item.priority-item.active .iname { color:#fff; }
  .item .inum { font-size:9px; color:#444; margin-bottom:1px; }
  .item .iname { font-size:12px; font-weight:600; color:#ddd; margin-bottom:2px; }
  .item.active .iname { color:#ff6b2b; }
  .item.as-item.active .iname { color:#4f8ef7; }
  .item .iaddr { font-size:10px; color:#555; line-height:1.4; }
  .item .iphone { font-size:10px; color:#4f8ef7; margin-top:2px; }
  #no-result { display:none; text-align:center; padding:30px 16px; color:#555; font-size:12px; }
  #map { flex:1; }
  #loading { position:fixed; top:56px; left:0; right:0; bottom:0; background:rgba(10,10,20,0.95); z-index:3000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .spinner { width:40px; height:40px; border:3px solid #333; border-top-color:#ff6b2b; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading-text { color:#ccc; font-size:14px; font-weight:600; }
  #progress-bar { width:220px; height:4px; background:#222; border-radius:2px; overflow:hidden; }
  #progress-fill { height:100%; background:#ff6b2b; border-radius:2px; width:0%; transition:width 0.2s; }
  #loading-sub { color:#555; font-size:11px; }
  #toggle-btn { display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#ff6b2b; color:#fff; border:none; border-radius:20px; padding:10px 20px; font-size:13px; font-weight:700; z-index:2000; box-shadow:0 4px 12px rgba(255,107,43,0.4); cursor:pointer; white-space:nowrap; }
  /* 팝업 */
  .leaflet-popup-content-wrapper { background:#1a1a2e !important; border:1px solid #ff6b2b !important; border-radius:10px !important; box-shadow:0 4px 20px rgba(0,0,0,0.7) !important; }
  .leaflet-popup-tip { background:#ff6b2b !important; }
  .leaflet-popup-close-button { color:#ff6b2b !important; top:8px !important; right:8px !important; font-size:16px !important; }
  .as-popup .leaflet-popup-content-wrapper { border-color:#4f8ef7 !important; }
  .as-popup .leaflet-popup-tip { background:#4f8ef7 !important; }
  .priority-popup .leaflet-popup-content-wrapper { border-color:#ffffff !important; }
  .priority-popup .leaflet-popup-tip { background:#ffffff !important; }
  .popup-tag { font-size:9px; margin-bottom:3px; }
  .popup-name { font-size:13px; font-weight:700; margin-bottom:5px; }
  .popup-addr { font-size:11px; color:#aaa; margin-bottom:4px; line-height:1.5; }
  .popup-phone { font-size:11px; color:#4f8ef7; margin-bottom:8px; }
  .popup-call { display:inline-block; padding:6px 14px; color:#fff; border-radius:12px; font-size:11px; font-weight:700; text-decoration:none; }
  @media(max-width:600px) {
    #sidebar { position:fixed; left:0; top:56px; bottom:0; z-index:500; transform:translateX(0); transition:transform 0.3s; }
    #sidebar.closed { transform:translateX(-100%); }
    #toggle-btn { display:block; }
    .htitle { font-size:14px; }
  }
</style>
</head>

// 각 항목에 전역 인덱스 부여 (필터링된 목록에서도 markers 배열과 정확히 매칭되도록)
DEALERS.forEach((d, i) => { d._i = i; });

// 지도 초기화
const map = L.map('map', { zoomControl:false }).setView([36.5, 127.8], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap contributors', maxZoom:19
}).addTo(map);
L.control.zoom({ position:'bottomright' }).addTo(map);

let markers = [], current = [...DEALERS], activeIdx = null, currentFilter = 'all';

// 최우선 노출 지점 (목록 최상단 + 검은색 마커)
const PRIORITY_NAMES = ['벤틀러스 구리본사', '벤틀러스 강동직영점', '벤틀러스 구리토평직영점'];
function isPriority(d) { return PRIORITY_NAMES.includes(d.name); }

// 줌 레벨에 따른 마커 크기 계산 (축소하면 작게, 확대하면 커지다가 일정 줌부터 고정)
const MARKER_MIN_ZOOM = 7;   // 이 줌 이하에서는 최소 크기 고정
const MARKER_MAX_ZOOM = 13;  // 이 줌 이상에서는 최대 크기 고정
const MARKER_MIN_SIZE = 14;
const MARKER_MAX_SIZE = 30;
function getMarkerSize(zoom) {
  if (zoom <= MARKER_MIN_ZOOM) return MARKER_MIN_SIZE;
  if (zoom >= MARKER_MAX_ZOOM) return MARKER_MAX_SIZE;
  const t = (zoom - MARKER_MIN_ZOOM) / (MARKER_MAX_ZOOM - MARKER_MIN_ZOOM);
  return MARKER_MIN_SIZE + (MARKER_MAX_SIZE - MARKER_MIN_SIZE) * t;
}

function makeIcon(type, priority, size) {
  size = size || MARKER_MAX_SIZE;

function refreshMarkerSizes() {

  markers.forEach((m, i) => {

    const d = DEALERS[i];
    m.marker.setIcon(makeIcon(d.type, isPriority(d), size));
  });
}

function geocodeAll() {
  const total = DEALERS.length;
  let done = 0;

  function finishOne() {
    done++;
    document.getElementById('progress-fill').style.width = (done/total*100)+'%';
    document.getElementById('loading-text').textContent = `위치 확인 중... ${done}/${total}`;
    if (done >= total) {
      document.getElementById('loading').style.display = 'none';
      refreshMarkerSizes();
      document.getElementById('badge').textContent = `대리점 ${DEALERS.filter(d=>d.type==='dealer').length}개`;
    }
  }

  let fallbackDelay = 0;

  DEALERS.forEach((d, i) => {
    // 이미 정확한 좌표를 알고 있는 경우 → 즉시 마커 표시 (API 호출 불필요)
    if (typeof d.lat === 'number' && typeof d.lng === 'number') {
      placeMarker(i, d, d.lat, d.lng);
      finishOne();
      return;
    }

    // 좌표 미확보 항목만 Nominatim으로 지오코딩 (1초 제한 준수)
    setTimeout(async () => {
      try {
        const q = encodeURIComponent(d.addr);
        const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&accept-language=ko&countrycodes=kr`);
        const data = await res.json();
        if (data.length > 0) {
          placeMarker(i, d, parseFloat(data[0].lat), parseFloat(data[0].lon));
        }
      } catch(e) {
        // 실패 시 마커 생략
      }
      finishOne();
    }, fallbackDelay += 1200);
  });
}

function renderSidebar(list) {
  const wrap = document.getElementById('list-wrap');
  const noResult = document.getElementById('no-result');
  if (!list.length) { wrap.innerHTML=''; noResult.style.display='block'; return; }
  noResult.style.display='none';
  wrap.innerHTML = list.map((d) => {
    const i = d._i;
    const priority = isPriority(d);
    const dot = priority ? `<span class="pr-dot"></span>` : (d.type==='dealer'?'🟠':'🔵');
    const inumText = priority ? (d.type==='dealer'?`No.${d.num}`:'') : `${d.type==='dealer'?`No.${d.num} · `:''}${d.region}`;
    return `
    <div class="item${d.type==='as'?' as-item':''}${priority?' priority-item':''}" id="item-${i}" onclick="setActive(${i})">
      <div class="inum">${inumText}</div>
      <div class="iname">${dot} ${d.name}</div>
      <div class="iaddr">${d.addr}</div>
      ${d.type === 'dealer' ? `<div class="iphone">${d.phone}</div>` : ''}
    </div>`;
  }).join('');
}

function setActive(i) {
  document.getElementById(`item-${activeIdx}`)?.classList.remove('active');
  activeIdx = i;
  document.getElementById(`item-${i}`)?.classList.add('active');
  document.getElementById(`item-${i}`)?.scrollIntoView({behavior:'smooth',block:'nearest'});
  if(markers[i]) {
    // 선택한 마커만 또렷하게, 나머지는 흐리게 (완전히 숨기지 않음 → 주변 매장 위치도 계속 파악 가능)
    markers.forEach((m, idx) => {
      if(!m) return;
      if(idx === i) {
        if(!map.hasLayer(m.marker)) m.marker.addTo(map);
        m.marker.setOpacity(1);
        m.marker.setZIndexOffset(1000);
      } else {
        m.marker.setOpacity(DIM_OPACITY);
        m.marker.setZIndexOffset(0);
      }
    });
    map.setView([markers[i].lat, markers[i].lng], 16, {animate:true});
    markers[i].marker.openPopup();
  }
  if(window.innerWidth<=600) { document.getElementById('sidebar').classList.add('closed'); document.getElementById('toggle-btn').textContent='📋 목록 보기'; }
}

function filterList(kw) {
  const k = kw.trim().toLowerCase();
  let list = currentFilter==='all' ? DEALERS : currentFilter==='dealer' ? DEALERS.filter(d=>d.type==='dealer') : DEALERS.filter(d=>d.type==='as' || isPriority(d));
  current = k ? list.filter(d=>d.name.toLowerCase().includes(k)||d.addr.toLowerCase().includes(k)||d.region.toLowerCase().includes(k)) : list;
  activeIdx = null;
  renderSidebar(current);
}

const DIM_OPACITY = 0.35; // 선택되지 않은 마커의 흐림 정도

function applyMarkerVisibility() {
  markers.forEach((m, i) => {
    if(!m) return;
    const d = DEALERS[i];
    m.marker.setOpacity(1);
    m.marker.setZIndexOffset(0);
    if(currentFilter==='all') { if(!map.hasLayer(m.marker)) m.marker.addTo(map); }
    else if(currentFilter==='dealer' && d.type==='dealer') { if(!map.hasLayer(m.marker)) m.marker.addTo(map); }
    else if(currentFilter==='as' && (d.type==='as' || isPriority(d))) { if(!map.hasLayer(m.marker)) m.marker.addTo(map); }
    else { map.removeLayer(m.marker); }
  });
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.className='filter-btn');
  if(f==='all') document.querySelectorAll('.filter-btn')[0].className='filter-btn active-dealer';
  else if(f==='dealer') document.querySelectorAll('.filter-btn')[1].className='filter-btn active-dealer';
  else document.querySelectorAll('.filter-btn')[2].className='filter-btn active-as';
  filterList(document.getElementById('search-input').value);
  applyMarkerVisibility();
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('closed');
  document.getElementById('toggle-btn').textContent = sb.classList.contains('closed')?'📋 목록 보기':'✕ 닫기';
}

renderSidebar(DEALERS);
geocodeAll();

// 안전장치: 무슨 이유로든 8초 안에 로딩이 안 끝나면 강제로 로딩 화면을 닫음
// (모바일에서 파일이 정상적인 브라우저가 아닌 미리보기 모드로 열린 경우 등 대비)
setTimeout(() => {
  const loading = document.getElementById('loading');
  if (loading && loading.style.display !== 'none') {
    loading.style.display = 'none';
    document.getElementById('badge').textContent = `대리점 ${DEALERS.filter(d=>d.type==='dealer').length}개`;
  }
}, 8000);
</script>
